<style id="exx-ut-css">
:root{--exx-ut-h:48px}
.exx-ut{position:fixed;top:0;left:0;right:0;min-height:48px;z-index:1060;background:#000;color:#fff;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;column-gap:18px;row-gap:4px;padding:6px 12px;box-sizing:border-box;font-family:'Helvetica Neue',Arial,sans-serif;text-decoration:none;line-height:1}
.exx-ut,.exx-ut:hover,.exx-ut:focus{color:#fff;text-decoration:none}
.exx-ut-txt{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.exx-ut-txt em{font-style:normal;color:#ff1f1f}
.exx-ut-cd{display:flex;align-items:flex-start;gap:4px;white-space:nowrap}
.exx-ut-u{display:flex;flex-direction:column;align-items:center;min-width:30px}
.exx-ut-n{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1}
.exx-ut-l{font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.85;margin-top:3px}
.exx-ut-sep{font-size:21px;font-weight:800;line-height:1;opacity:.9}
html.exx-ut-on{scroll-padding-top:var(--exx-ut-h)}
html.exx-ut-on body{padding-top:var(--exx-ut-h)}
html.exx-ut-on .promo-bar{display:none !important}
html.exx-ut-on .head-container.head-fix{top:var(--exx-ut-h) !important}
html.exx-ut-on .template-home .head-container:not(.head-fix){top:var(--exx-ut-h)}
@media (max-width:767px){
  .exx-ut{min-height:44px;column-gap:12px;row-gap:3px;padding:5px 8px}
  .exx-ut-txt{font-size:12px;letter-spacing:.04em}
  .exx-ut-u{min-width:26px}
  .exx-ut-n{font-size:17px}
  .exx-ut-l{font-size:8px;margin-top:2px}
  .exx-ut-sep{font-size:17px}
}
</style>
<script id="exx-ut-js">
(function(){try{
  /* ===== CONFIGURACAO ===== */
  var CFG = {
    inicio: '2026-11-18T00:00:00-03:00',   /* comeca a aparecer (Brasilia) */
    fim:    '2026-11-18T23:59:59-03:00',   /* acaba: some sozinha ao virar 19/11 */
    texto:  'MEGA BLACK EXX · <em>COMPRE 2 LEVE 3</em> no Ultra Protein 420g', /* frase da esquerda */
    aviso:  'TERMINA EM',                  /* frase antes do contador */
    avisoVespera: 'ACABA AMANHA',
    avisoUltimo:  'SO HOJE, ACABA EM',
    link:   'https://exxnutrition.com.br/produtos/ultra-protein-whey-420g-exx-nutrition-1tw3l/'
  };
  /* ======================== */
  if (window.__EXX_UT__) return; window.__EXX_UT__ = 1;
  var force = /[?&]ultra1811test=1\b/.test(location.search);
  var ini = new Date(CFG.inicio).getTime(), fim = new Date(CFG.fim).getTime();
  if (isNaN(ini) || isNaN(fim)) return;
  var agora = Date.now();
  if (!force && (agora < ini || agora >= fim)) return;   /* fora do periodo: nada aparece */
  var html = document.documentElement, body = document.body;
  if (!body) return;

  function esc(s){ return String(s).replace(/[<>]/g, function(c){ return c === '<' ? '&lt;' : '&gt;'; }); }
  function pad(n){ n = Math.max(0, n); return (n < 10 ? '0' : '') + n; }
  function unidade(cls, rotulo){ return '<span class="exx-ut-u"><span class="exx-ut-n" data-exx-ut="' + cls + '">00</span><span class="exx-ut-l">' + rotulo + '</span></span>'; }
  var sep = '<span class="exx-ut-sep">:</span>';

  var bar = document.createElement(CFG.link ? 'a' : 'div');
  if (CFG.link) bar.href = CFG.link;
  bar.className = 'exx-ut';
  bar.setAttribute('role', 'status');
  bar.setAttribute('aria-live', 'off');
  var texto = esc(CFG.texto).replace(/&lt;em&gt;/g, '<em>').replace(/&lt;\/em&gt;/g, '</em>');
  bar.innerHTML =
    '<span class="exx-ut-txt">' + texto + ' <span class="exx-ut-aviso">' + esc(CFG.aviso) + '</span></span>' +
    '<span class="exx-ut-cd">' + unidade('d', 'Dias') + sep + unidade('h', 'Horas') + sep + unidade('m', 'Min') + sep + unidade('s', 'Seg') + '</span>';
  body.insertBefore(bar, body.firstChild);
  html.className += ' exx-ut-on';
  function medir(){ try { var h = bar.offsetHeight; if (h) html.style.setProperty('--exx-ut-h', h + 'px'); } catch (e) {} }
  medir(); setTimeout(medir, 300); setTimeout(medir, 1500);
  window.addEventListener('resize', medir); window.addEventListener('orientationchange', medir);

  var el = { d: bar.querySelector('[data-exx-ut="d"]'), h: bar.querySelector('[data-exx-ut="h"]'), m: bar.querySelector('[data-exx-ut="m"]'), s: bar.querySelector('[data-exx-ut="s"]') };
  var aviso = bar.querySelector('.exx-ut-aviso');
  var DIA = 86400000;

  function remover(){
    try { if (bar.parentNode) bar.parentNode.removeChild(bar); } catch (e) {}
    html.className = html.className.replace(/\s*exx-ut-on\b/, '');
    try { html.style.removeProperty('--exx-ut-h'); } catch (e) {}
  }
  function tick(){
    var resta = fim - Date.now();
    if (resta <= 0) { if (!force) { remover(); return; } resta = 0; }
    var d = Math.floor(resta / DIA), h = Math.floor(resta % DIA / 3600000), m = Math.floor(resta % 3600000 / 60000), s = Math.floor(resta % 60000 / 1000);
    el.d.textContent = pad(d); el.h.textContent = pad(h); el.m.textContent = pad(m); el.s.textContent = pad(s);
    var frase = resta <= DIA ? CFG.avisoUltimo : (resta <= 2 * DIA ? CFG.avisoVespera : CFG.aviso);
    if (aviso.textContent !== frase) aviso.textContent = frase;
    setTimeout(tick, 1000 - (Date.now() % 1000));
  }
  tick();
}catch(e){}})();
</script>
