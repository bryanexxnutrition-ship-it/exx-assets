<a id="exx-ultra-tb" class="exx-ultra-tb" href="https://exxnutrition.com.br/produtos/ultra-protein-whey-420g-exx-nutrition-1tw3l/" style="display:none" role="status" aria-live="off">

  </span>
  <span class="exx-ultra-tb-txt">COMPRE 2 e LEVE 3 no Ultra Protein 420g, acaba em <b id="exx-ultra-tb-time" class="exx-ultra-tb-clock">00:00:00</b></span>
</a>
<style>
  #exx-ultra-tb.exx-ultra-tb{
    display:flex; align-items:center; justify-content:center; gap:8px;
    position:fixed; top:0; left:0; right:0; z-index:1100;
    box-sizing:border-box; margin:0; padding:10px 14px;
    background:#e10600; color:#fff; text-decoration:none;
    font-family:inherit; font-size:15px; font-weight:600; line-height:1.2;
    text-align:center; letter-spacing:.2px;
  }
  #exx-ultra-tb .exx-ultra-tb-ico{display:inline-flex; align-items:center; color:#fff;}
  #exx-ultra-tb .exx-ultra-tb-clock{font-variant-numeric:tabular-nums; font-weight:800; margin-left:2px; color:#fff;}
  
  html.exx-ultb-on #container{ padding-top:var(--exx-ultb-h,42px) !important; }
  html.exx-ultb-on .js-promo-bar{ top:var(--exx-ultb-h,42px) !important; }
  
  @media(max-width:767px){
    html.exx-ultb-on body.template-home [data-store="head"].head-fix{ display:none !important; }
    html.exx-ultb-on body.template-home [data-store="head"]:not(.head-fix) .search-logo-cart-container{ padding-top:calc(var(--exx-ultb-h,42px) + 6px) !important; padding-bottom:10px !important; background:#000 !important; }
    html.exx-ultb-on body.template-home .hero-video-section{ margin-top:78px !important; background:#000 !important; }
  }
  
  html.exx-ultb-on .js-ajax-cart-panel{ padding-top:var(--exx-ultb-h,42px) !important; box-sizing:border-box !important; }
  
  @media(min-width:768px){ html.exx-ultb-on body.template-home .search-logo-cart-container{ padding-top:calc(var(--exx-ultb-h,42px) + 10px) !important; } }
  @media(max-width:600px){
    #exx-ultra-tb.exx-ultra-tb{font-size:12.5px; padding:8px 10px; gap:6px;}
    #exx-ultra-tb .exx-ultra-tb-ico svg{width:14px;height:14px;}
  }
</style>
<script>
(function(){
  var el=document.getElementById('exx-ultra-tb');
  var t=document.getElementById('exx-ultra-tb-time');
  if(!el||!t) return;
  var START=new Date('2026-11-18T00:00:00-03:00').getTime();
  var END  =new Date('2026-11-19T00:00:00-03:00').getTime();
  var force=/[?&]ultra1811test=1\b/.test(location.search); // previa antes do dia
  var root=document.documentElement;
  function pad(n){return (n<10?'0':'')+n;}
  function setOffset(){ var h=el.offsetHeight||42; root.style.setProperty('--exx-ultb-h', h+'px'); }
  function tick(){
    var now=Date.now();
    var visible = force ? (now<END) : (now>=START && now<END);
    if(!visible){ el.style.display='none'; root.classList.remove('exx-ultb-on'); return; }
    el.style.display='flex';
    root.classList.add('exx-ultb-on'); setOffset();
    var s=Math.max(0,Math.floor((END-now)/1000));
    var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
    t.textContent=pad(h)+':'+pad(m)+':'+pad(sec);
  }
  tick(); setInterval(tick,1000);
  window.addEventListener('resize', function(){ if(root.classList.contains('exx-ultb-on')) setOffset(); });
})();
</script>
